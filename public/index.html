<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<title>spacecentre</title>
	<meta name="description" content="spacecentre. Deep space, drifting.">
	<meta name="theme-color" content="#05060B">
	<link rel="icon" href="favicon.svg" type="image/svg+xml">
	<link rel="icon" href="favicon.png" type="image/png" sizes="64x64">
	<link rel="preload" href="fonts/syncopate-700.woff2" as="font" type="font/woff2" crossorigin>
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<canvas id="space" aria-hidden="true"></canvas>
	<canvas id="stars" aria-hidden="true"></canvas>

	<main id="centre">
		<svg id="mark" viewBox="0 0 200 200" role="img" aria-label="spacecentre constellation mark">
			<defs>
				<filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
					<feGaussianBlur stdDeviation="2.2" result="b"/>
					<feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
				</filter>
				<filter id="bigglow" x="-100%" y="-100%" width="300%" height="300%">
					<feGaussianBlur stdDeviation="6"/>
				</filter>
			</defs>
			<circle class="ring" cx="100" cy="100" r="96"/>
			<g class="dust">
				<circle cx="170" cy="72" r="1.4"/><circle cx="31" cy="118" r="1.1"/>
				<circle cx="162" cy="184" r="1.2"/><circle cx="42" cy="28" r="1"/>
				<circle cx="128" cy="62" r="0.9"/><circle cx="72" cy="140" r="0.9"/>
			</g>
			<polyline class="line" pathLength="1" points="150,40 100,25 55,55 85,95 120,110 145,150 100,175 50,160"/>
			<polyline class="pulse" pathLength="1" points="150,40 100,25 55,55 85,95 120,110 145,150 100,175 50,160"/>
			<g class="stars">
				<g style="--i:0"><circle class="halo" cx="150" cy="40" r="11"/><circle class="core" cx="150" cy="40" r="4.3"/></g>
				<g style="--i:1"><circle class="halo" cx="100" cy="25" r="17"/><circle class="core" cx="100" cy="25" r="6.4"/></g>
				<g style="--i:2"><circle class="halo" cx="55" cy="55" r="12"/><circle class="core" cx="55" cy="55" r="4.8"/></g>
				<g style="--i:3"><circle class="halo" cx="85" cy="95" r="10"/><circle class="core" cx="85" cy="95" r="3.9"/></g>
				<g style="--i:4"><circle class="halo" cx="120" cy="110" r="17"/><circle class="core" cx="120" cy="110" r="6.4"/></g>
				<g style="--i:5"><circle class="halo" cx="145" cy="150" r="11"/><circle class="core" cx="145" cy="150" r="4.3"/></g>
				<g style="--i:6"><circle class="halo" cx="100" cy="175" r="17"/><circle class="core" cx="100" cy="175" r="6.4"/></g>
				<g style="--i:7"><circle class="halo" cx="50" cy="160" r="12"/><circle class="core" cx="50" cy="160" r="4.8"/></g>
			</g>
		</svg>
		<h1 id="wordmark" data-text="spacecentre">spacecentre</h1>
	</main>

	<p id="caption" aria-live="polite"><a id="caption-link" href="#" target="_blank" rel="noopener"><span id="caption-name"></span><span id="caption-source"></span></a></p>
	<p id="credit">Images <a href="https://esawebb.org/copyright/" target="_blank" rel="noopener">NASA, ESA, CSA, STScI</a></p>

	<script src="main.js" defer></script>
</body>
</html>
